<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>نظام التنبيهات</title>

<style>
body {
    font-family: Tahoma;
    background: linear-gradient(to right, #0f172a, #1e3a8a);
    color: white;
    text-align: center;
    direction: rtl;
    padding: 20px;
}

#app { display: none; }

button {
    padding: 10px 20px;
    margin: 10px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

.login-btn { background: #22c55e; color: white; }
.logout-btn { background: red; color: white; }
.alert-btn { background: #3b82f6; color: white; }
.solve-btn { background: orange; color: white; }

.alert {
    background: red;
    padding: 10px;
    margin: 10px;
    border-radius: 8px;
}

.done {
    background: green;
}
</style>
</head>

<body>

<h1>🚨 نظام إدارة التنبيهات</h1>

<!-- تسجيل الدخول -->
<div id="login">
<h3>اختر نوع المستخدم</h3>

<select id="role">
<option value="admin">مشرف</option>
<option value="tech">فني</option>
</select>

<br>
<button class="login-btn" onclick="login()">دخول</button>
</div>

<!-- النظام -->
<div id="app">

<button class="logout-btn" onclick="logout()">تسجيل خروج</button>

<div id="adminControls" style="display:none;">
    <button class="alert-btn" onclick="addAlert()">إرسال تنبيه</button>
</div>

<h3>📢 التنبيهات</h3>
<div id="alerts"></div>

</div>

<script>

let role = "";
let alerts = JSON.parse(localStorage.getItem("alerts")) || [];

function save(){
    localStorage.setItem("alerts", JSON.stringify(alerts));
}

function login(){
    role = document.getElementById("role").value;

    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";

    if(role === "admin"){
        document.getElementById("adminControls").style.display="block";
    } else {
        document.getElementById("adminControls").style.display="none";
    }

    render();
}

function logout(){
    document.getElementById("app").style.display="none";
    document.getElementById("login").style.display="block";
}

function addAlert(){
    alerts.push({id: Date.now(), status: "new"});
    save();
    render();
}

function solve(id){
    alerts = alerts.map(function(a){
        if(a.id === id){
            a.status = "done";
        }
        return a;
    });
    save();
    render();
}

function render(){
    let div = document.getElementById("alerts");
    div.innerHTML = "";

    alerts.forEach(function(a){

        let box = document.createElement("div");
        box.className = (a.status === "done") ? "done alert" : "alert";

        box.innerHTML = "🚨 تنبيه - الحالة: " + (a.status === "new" ? "جديد" : "تم الحل");

        if(role === "tech" && a.status === "new"){
            let btn = document.createElement("button");
            btn.className = "solve-btn";
            btn.innerText = "حل";
            btn.onclick = function(){ solve(a.id); };
            box.appendChild(document.createElement("br"));
            box.appendChild(btn);
        }

        div.appendChild(box);
    });
}

</script>

</body>
</html>
