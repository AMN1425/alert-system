<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Smart Alert System</title>

<style>
body {
    font-family: Tahoma;
    background: linear-gradient(to right, #141e30, #243b55);
    color: white;
    direction: rtl;
    padding: 20px;
}

h1 {
    text-align: center;
}

.login, .app {
    text-align: center;
    margin-top: 50px;
}

.app {
    display: none;
}

button {
    padding: 10px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.alert {
    background: #ff4d4d;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
}

.done {
    background: #2ecc71;
}
</style>

</head>

<body>

<h1>🚨 نظام إدارة التنبيهات الذكي</h1>

<div class="login" id="login">
<h3>تسجيل الدخول</h3>

<select id="role">
<option value="admin">مشرف</option>
<option value="tech">فني</option>
</select>

<br>
<button onclick="login()">دخول</button>
</div>

<div class="app" id="app">

<button onclick="addAlert()">إرسال تنبيه</button>

<div id="alerts"></div>

</div>

<script>

let alerts = [];

function login() {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
}

function addAlert() {
    let div = document.getElementById("alerts");

    let alert = document.createElement("div");
    alert.className = "alert";
    alert.innerHTML = "🚨 تنبيه جديد <button onclick='solve(this)'>حل</button>";

    div.appendChild(alert);
}

function solve(btn) {
    let alert = btn.parentElement;
    alert.classList.remove("alert");
    alert.classList.add("done");
    alert.innerHTML = "✅ تم حل التنبيه";
}

</script>

</body>
</html>
