<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Smart Alert System</title>

<style>
body {
    font-family: Tahoma;
    background: linear-gradient(to right, #141e30, #243b55);
    color: white;
    direction: rtl;
    text-align: center;
    padding: 20px;
}

h1 {
    margin-bottom: 20px;
}

#login, #app {
    margin-top: 30px;
}

#app {
    display: none;
}

button {
    padding: 10px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.alert {
    background: #ff4d4d;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
}

.done {
    background: #2ecc71;
}
</style>

</head>

<body>

<h1>🚨 نظام إدارة التنبيهات الذكي</h1>

<!-- LOGIN -->
<div id="login">
<h3>تسجيل الدخول</h3>

<select id="role">
<option value="admin">مشرف</option>
<option value="tech">فني</option>
</select>

<br>
<button onclick="login()">دخول</button>
</div>

<!-- APP -->
<div id="app">

<button onclick="addAlert()">إرسال تنبيه</button>

<div id="alerts"></div>

</div>

<script>

let role = "";

function login() {
    role = document.getElementById("role").value;
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
}

function addAlert() {
    let alertsDiv = document.getElementById("alerts");

    let alertBox = document.createElement("div");
    alertBox.className = "alert";

    alertBox.innerHTML = "🚨 تنبيه جديد";

    // زر الحل يظهر فقط للفني
    if (role === "tech") {
        let btn = document.createElement("button");
        btn.innerText = "تم الإصلاح";
        btn.onclick = function() {
            alertBox.classList.remove("alert");
            alertBox.classList.add("done");
            alertBox.innerHTML = "✅ تم حل التنبيه";
        };
        alertBox.appendChild(document.createElement("br"));
        alertBox.appendChild(btn);
    }

    alertsDiv.appendChild(alertBox);
}

</script>

</body>
</html>
