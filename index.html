<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Smart Alert System</title>

<style>
body {
    font-family: Tahoma;
    background: #0f172a;
    color: white;
    direction: rtl;
    text-align: center;
    padding: 20px;
}

#app { display: none; }

button {
    padding: 10px;
    margin: 10px;
    cursor: pointer;
}

.alert {
    background: red;
    margin: 10px;
    padding: 10px;
}

.done {
    background: green;
}
</style>

</head>

<body>

<h1>🚨 نظام التنبيهات</h1>

<div id="login">
<h3>تسجيل الدخول</h3>

<select id="role">
<option value="admin">مشرف</option>
<option value="tech">فني</option>
</select>

<br>
<button onclick="login()">دخول</button>
</div>

<div id="app">

<button onclick="addAlert()">إرسال تنبيه</button>

<div id="alerts"></div>

<p id="stats"></p>

</div>

<script>

let role = "";
let alerts = JSON.parse(localStorage.getItem("alerts")) || [];

function save() {
    localStorage.setItem("alerts", JSON.stringify(alerts));
}

function login() {
    role = document.getElementById("role").value;
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    render();
}

function addAlert() {
    alerts.push({ id: Date.now(), status: "new" });
    save();
    render();
}

function solve(id) {
    alerts = alerts.map(function(a) {
        if (a.id === id) {
            a.status = "done";
        }
        return a;
    });
    save();
    render();
}

function render() {
    var div = document.getElementById("alerts");
    var stats = document.getElementById("stats");

    div.innerHTML = "";

    for (var i = 0; i < alerts.length; i++) {
        var a = alerts[i];

        if (role === "tech" && a.status === "done") {
            continue;
        }

        var box = document.createElement("div");
        box.className = (a.status === "done") ? "done" : "alert";

        box.innerHTML = "🚨 تنبيه<br>الحالة: " + (a.status === "new" ? "جديد" : "تم الحل");

        if (role === "tech" && a.status === "new") {
            var btn = document.createElement("button");
            btn.innerText = "تم الإصلاح";
            btn.onclick = (function(id) {
                return function() {
                    solve(id);
                };
            })(a.id);
            box.appendChild(document.createElement("br"));
            box.appendChild(btn);
        }

        div.appendChild(box);
    }

    var active = alerts.filter(a => a.status === "new").length;
    var done = alerts.filter(a => a.status === "done").length;

    stats.innerHTML = "🔴 نشط: " + active + " | 🟢 تم الحل: " + done;
}

document.getElementById("login").style.display = "block";

</script>

</body>
</html>
