<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Smart Alert System</title>

<style>
body {
    font-family: Tahoma;
    background: linear-gradient(to right, #141e30, #243b55);
    color: white;
    direction: rtl;
    text-align: center;
    padding: 20px;
}

h1 { margin-bottom: 20px; }

#app { display: none; }

button {
    padding: 10px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.alert {
    background: #ff4d4d;
    margin: 10px;
    padding: 10px;
    border-radius: 10px;
}

.done {
    background: #2ecc71;
}

.stats {
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>

<body>

<h1>🚨 نظام إدارة التنبيهات الذكي</h1>

<div id="login">
<h3>تسجيل الدخول</h3>
<select id="role">
<option value="admin">مشرف</option>
<option value="tech">فني</option>
</select>
<br>
<button onclick="login()">دخول</button>
</div>

<div id="app">

<button onclick="addAlert()">إرسال تنبيه</button>

<div class="stats" id="stats"></div>

<div id="alerts"></div>

</div>

<script>

let alerts = JSON.parse(localStorage.getItem("alerts")) || [];
let role = "";

function save() {
    localStorage.setItem("alerts", JSON.stringify(alerts));
}

function login() {
    role = document.getElementById("role").value;
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    render();
}

function addAlert() {
    alerts.push({
        id: Date.now(),
        status: "new"
    });
    save();
    render();
}

function solve(id) {
    alerts = alerts.map(a => {
        if (a.id === id) a.status = "done";
        return a;
    });
    save();
    render();
}

function render() {
    let div = document.getElementById("alerts");
    let stats = document.getElementById("stats");

    div.innerHTML = "";

    alerts.forEach(a => {

        if (role === "tech" && a.status === "done") return;

        div.innerHTML += `
        <div class="${a.status === 'done' ? 'done' : 'alert'}">
            🚨 تنبيه
            <br>
            الحالة: ${a.status === "new" ? "جديد" : "تم الحل"}
            <br>
            ${role === "tech" && a.status === "new"
                ? <button onclick="solve(${a.id})">تم الإصلاح</button>
                : ""}
        </div>
        `;
    });

    let active = alerts.filter(a => a.status === "new").length;
    let done = alerts.filter(a => a.status === "done").length;

    stats.innerHTML = `
    🔴 نشط: ${active} | 🟢 تم الحل: ${done}
    `;
}

document.getElementById("login").style.display = "block";

</script>

</body>
</html>
