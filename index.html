<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Alert System</title>

<style>
body {
    font-family: Tahoma;
    background: #111;
    color: white;
    text-align: center;
    direction: rtl;
    padding: 20px;
}

#app { display: none; }

button {
    padding: 10px;
    margin: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🚨 نظام التنبيهات</h1>

<div id="login">
<h3>تسجيل الدخول</h3>

<select id="role">
<option value="admin">مشرف</option>
<option value="tech">فني</option>
</select>

<br>
<button id="loginBtn">دخول</button>
</div>

<div id="app">
<h3>تم تسجيل الدخول ✅</h3>
<button onclick="addAlert()">إرسال تنبيه</button>
<div id="alerts"></div>
</div>

<script>

// ربط الزر بعد تحميل الصفحة
document.getElementById("loginBtn").addEventListener("click", function () {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
});

function addAlert(){
    document.getElementById("alerts").innerHTML += "<p>🚨 تنبيه جديد</p>";
}

</script>

</body>
</html>
